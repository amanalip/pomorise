<!-- Declare modern HTML so browsers use standards mode for the Pomorise application. -->
<!doctype html>
<!-- Identify the document language so assistive technology pronounces the interface correctly. -->
<html lang="en">
  <!-- Open the metadata container that describes the page before visible content begins. -->
  <head>
    <!-- Decode every source character as UTF-8 so the product copy remains portable. -->
    <meta charset="UTF-8" />
    <!-- Match the layout viewport to the device width so later responsive work starts correctly. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Apply the stored or system dark palette before first paint so returning dark visitors never see a light flash. -->
    <script>
      (() => {
        // Start from no resolved theme so restricted storage still falls back to the system query.
        let theme = null;
        try {
          // Read the same non-sensitive appearance key the application persists.
          const stored = localStorage.getItem("pomorise.theme");
          // Accept only explicit choices because system-following is decided below.
          theme = stored === "dark" || stored === "light" ? stored : null;
        } catch {
          // Continue with the operating-system preference when storage is unavailable.
        }
        // Resolve system-following visitors through the standard media feature.
        if (theme === null) {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        // Stamp only the dark attribute because light tokens are the root default.
        if (theme === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <!-- Use a compact approved identity derivative for browser tabs and installed-app launchers. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/pomorise/icons/pomorise-192.png" />
    <!-- Give iOS a local high-resolution identity without making a network request. -->
    <link rel="apple-touch-icon" href="/pomorise/icons/apple-touch-icon.png" />
    <!-- Match browser chrome to the approved deep-plum application identity. -->
    <meta name="theme-color" content="#321b3b" />
    <!-- Provide a concise search and installation description. -->
    <meta
      name="description"
      content="A calm, private focus timer that works one session at a time."
    />
    <!-- Give browser tabs and assistive technology a concise product name. -->
    <title>Pomorise</title>
    <!-- Close the metadata container before the visible application document begins. -->
  </head>
  <!-- Open the visible document body that React will populate. -->
  <body>
    <!-- Provide the single mounting point where React owns the application interface. -->
    <div id="root"></div>
    <!-- Load the typed application entry through Vite's local module pipeline. -->
    <script type="module" src="/src/main.tsx"></script>
    <!-- Close the visible document body after the application entry. -->
  </body>
  <!-- Close the HTML document after all metadata and application content. -->
</html>
