<!-- Declare modern HTML so browsers use standards mode for the Pomorise application. -->
<!doctype html>
<!-- Identify the document language so assistive technology pronounces the interface correctly. -->
<html lang="en">
  <!-- Open the metadata container that describes the page before visible content begins. -->
  <head>
    <!-- Decode every source character as UTF-8 so the product copy remains portable. -->
    <meta charset="UTF-8" />
    <!-- Match the layout viewport to the device width so later responsive work starts correctly. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Reuse the approved local light logo as a temporary browser icon until Phase 6 icon hardening. -->
    <link rel="icon" type="image/png" href="/assets/logos/light_mode.png" />
    <!-- Give browser tabs and assistive technology a concise product name. -->
    <title>Pomorise</title>
    <!-- Close the metadata container before the visible application document begins. -->
  </head>
  <!-- Open the visible document body that React will populate. -->
  <body>
    <!-- Provide the single mounting point where React owns the application interface. -->
    <div id="root"></div>
    <!-- Load the typed application entry through Vite's local module pipeline. -->
    <script type="module" src="/src/main.tsx"></script>
    <!-- Close the visible document body after the application entry. -->
  </body>
  <!-- Close the HTML document after all metadata and application content. -->
</html>
