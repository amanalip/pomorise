name: Build and deploy Pomorise to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    outputs:
      app_ready: ${{ steps.app.outputs.ready }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check whether the application is ready
        id: app
        shell: bash
        run: |
          if [[ -f package.json && -f package-lock.json ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "The application is ready to build."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped until the application scaffold and lockfile are committed."
          fi

      - name: Set up Node.js
        if: steps.app.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        if: steps.app.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - name: Install dependencies
        if: steps.app.outputs.ready == 'true'
        run: npm ci

      - name: Build production website
        if: steps.app.outputs.ready == 'true'
        run: npm run build

      - name: Upload production website
        if: steps.app.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Deploy website
    if: needs.build.outputs.app_ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
